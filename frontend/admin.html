<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | FinancePro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body class="app-body">
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle">&#9776;</button>
                <h1>Admin Dashboard</h1>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">&#9790;</button>
            </header>
            <main class="page-content">
                <!-- Date Range Filter -->
                <div class="range-filter" id="rangeFilter"></div>
                <div id="customDateWrap" class="range-filter" style="display:none; align-items:center;">
                    <input type="date" class="form-input" id="rangeDateFrom" style="max-width:160px;">
                    <input type="date" class="form-input" id="rangeDateTo" style="max-width:160px;">
                    <button class="btn btn-primary" id="dateApplyBtn">Apply</button>
                </div>

                <!-- Quick Stats (YTD) -->
                <div id="quickStats"></div>

                <!-- KPI Cards -->
                <div id="kpiSection"></div>

                <!-- Charts Row 1 -->
                <div class="chart-grid-2">
                    <div class="card">
                        <div class="card-header"><h3>Income vs Expense (Monthly)</h3></div>
                        <div class="chart-container" style="height:300px;"><canvas id="adminIncomeExpenseChart"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Net Cash Flow</h3></div>
                        <div class="chart-container" style="height:300px;"><canvas id="adminNetCashChart"></canvas></div>
                    </div>
                </div>

                <!-- Charts Row 2 -->
                <div class="chart-grid-3">
                    <div class="card">
                        <div class="card-header"><h3>Transactions / Month</h3></div>
                        <div class="chart-container" style="height:280px;"><canvas id="adminTrxPerMonthChart"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Users Growth</h3></div>
                        <div class="chart-container" style="height:280px;"><canvas id="adminUsersGrowthChart"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Monthly Financial Trend</h3></div>
                        <div class="chart-container" style="height:280px;"><canvas id="adminMonthlyTrendChart"></canvas></div>
                    </div>
                </div>

                <!-- Charts Row 3 -->
                <div class="chart-grid-2">
                    <div class="card">
                        <div class="card-header"><h3>Expense by Category</h3></div>
                        <div class="chart-container" style="height:300px;"><canvas id="adminExpenseCatChart"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Income by Category</h3></div>
                        <div class="chart-container" style="height:300px;"><canvas id="adminIncomeCatChart"></canvas></div>
                    </div>
                </div>

                <!-- Charts Row 4 -->
                <div class="card">
                    <div class="card-header"><h3>Daily Transactions (Last 30 Days)</h3></div>
                    <div class="chart-container" style="height:300px;"><canvas id="adminDailyTrxChart"></canvas></div>
                </div>

                <!-- Insights -->
                <div class="card">
                    <div class="card-header"><h3>Business Insights</h3></div>
                    <div id="insightsContainer"></div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header card-header-actions">
                        <h3>Recent Activity</h3>
                        <a href="admin-activity.html" class="btn btn-sm btn-secondary">View All</a>
                    </div>
                    <div id="recentActivityTable"></div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
