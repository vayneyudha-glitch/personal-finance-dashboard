<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | FinancePro Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-body">
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle">&#9776;</button>
                <h1>User Management</h1>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">&#9790;</button>
            </header>
            <main class="page-content">
                <!-- Filters -->
                <div class="card">
                    <div class="filters-row" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                        <input type="text" class="form-input" id="searchInput" placeholder="Search name, email, phone..." style="flex:1; min-width:200px;">
                        <select class="form-input" id="roleFilter" style="max-width:120px;">
                            <option value="">All Roles</option>
                            <option value="ADMIN">Admin</option>
                            <option value="USER">User</option>
                        </select>
                        <select class="form-input" id="statusFilter" style="max-width:120px;">
                            <option value="">All Status</option>
                            <option value="ACTIVE">Active</option>
                            <option value="INACTIVE">Inactive</option>
                        </select>
                        <select class="form-input" id="limitFilter" style="max-width:80px;">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                        </select>
                        <button class="btn btn-primary" id="searchBtn">Search</button>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="card">
                    <div id="usersTable"></div>
                    <div id="usersPagination"></div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/admin-users.js"></script>
</body>
</html>
