<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — FinancePro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <span class="logo-icon">&#x1F4B0;</span>
                    <span>FinancePro</span>
                </a>
                <h1>Create Your Account</h1>
                <p>Start managing your finances today</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" placeholder="John Doe" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <input type="text" id="regPhone" placeholder="08123456789" autocomplete="tel" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" placeholder="Min. 8 characters" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" id="regPasswordToggle">&#x1F441;</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regConfirmPassword" placeholder="Repeat password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" id="regConfirmToggle">&#x1F441;</button>
                    </div>
                </div>
                <div class="auth-error" id="registerError" style="display:none;"></div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Register</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Login here</a></p>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script>
        if (isLoggedIn()) {
            window.location.href = isAdmin() ? 'admin.html' : 'dashboard.html';
        }

        function showError(msg) {
            var el = document.getElementById('registerError');
            el.textContent = msg;
            el.style.display = 'block';
        }
        function clearError() {
            var el = document.getElementById('registerError');
            el.textContent = '';
            el.style.display = 'none';
        }

        function initToggle(toggleId, inputId) {
            var toggle = document.getElementById(toggleId);
            var input = document.getElementById(inputId);
            toggle.addEventListener('click', function() {
                input.type = input.type === 'password' ? 'text' : 'password';
                this.textContent = input.type === 'password' ? '\uD83D\uDC41' : '\uD83D\uDE48';
            });
        }
        initToggle('regPasswordToggle', 'regPassword');
        initToggle('regConfirmToggle', 'regConfirmPassword');

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearError();

            var name = document.getElementById('regName').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var phone = document.getElementById('regPhone').value.trim();
            var password = document.getElementById('regPassword').value;
            var confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!name || !email || !phone || !password) {
                showError('All fields are required.');
                return;
            }
            if (password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }
            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            var btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            var result = await AuthAPI.register(name, email, phone, password, confirmPassword);

            btn.disabled = false;
            btn.textContent = 'Register';

            if (!result.ok) {
                showError(result.data.message || 'Registration failed.');
                return;
            }

            showToast('Registration successful! Redirecting...', 'success');
            setTimeout(function() { window.location.href = 'dashboard.html'; }, 1000);
        });
    </script>
</body>
</html>
